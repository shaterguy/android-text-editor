plugins {
    id "com.android.application"
}
android {
    namespace "com.shaterguy.opentext"
    compileSdk 36
    defaultConfig {
        applicationId "com.shaterguy.opentext"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "0.1.0-dev1"
    }
    buildTypes {
        debug {
            applicationIdSuffix ".dev"
        }
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
