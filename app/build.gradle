plugins {
    id "com.android.application"
}
android {
    namespace "com.shaterguy.opentext"
    compileSdk 36
    defaultConfig {
        applicationId "com.shaterguy.opentext"
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName "0.1.0-dev2"
    }
    buildTypes {
        debug {
            applicationIdSuffix ".dev"
        }
        release {
            // Intentionally unsigned; signing-only workflow consumes verified APK bytes.
            minifyEnabled false
        }
    }
    testOptions {
        unitTests.includeAndroidResources = true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.robolectric:robolectric:4.16.1"
}
