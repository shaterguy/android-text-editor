name: Android fallback APK

# Normal development, tests and packaging run in the local Termux workspace.
# This workflow is a fallback only; main branch pushes do not trigger builds.
on:
  workflow_dispatch:
  push:
    branches:
      - 'ci-fallback/**'

permissions:
  contents: read

jobs:
  debug-apk:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[gh-fallback:android-fallback.yml]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install SDK platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: OpenText-fallback-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
